[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dectate"
version = "0.15.dev0"
dynamic = ["readme"]
description = "A configuration engine for Python frameworks"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Martijn Faassen", email = "faassen@startifact.com"}]
maintainers = [{name = "Henri Hulski", email = "henri@sancode.it"}]
keywords = ["configuration"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">= 3.10"

[project.urls]
Documentation = "https://dectate.readthedocs.io"
Repository = "https://github.com/morepath/dectate"
Issues = "https://github.com/morepath/dectate/issues"
Changelog = "https://github.com/morepath/dectate/blob/master/CHANGES.txt"

[project.optional-dependencies]
test = ["pytest >= 8", "pytest-env"]
coverage = ["pytest-cov"]
lint = ["black", "flake8", "flake8-pyproject"]
docs = ["sphinx"]
mypy = ["mypy", "pytest"]
pyright = ["pyright", "pytest"]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
dectate = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["dectate"]
addopts = ["-vv"]
env = ["RUN_ENV=test"]

[tool.coverage.run]
omit = ["dectate/tests/*", "dectate/types.py"]
source = ["dectate"]

[tool.coverage.report]
show_missing = true

[tool.flake8]
show-source = true
ignore = ["E203", "E301", "E501", "E704", "W503", "W504"]
max-line-length = 80

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "dectate.sphinxext.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "dectate.tests.fixtures.*"
ignore_errors = true

[tool.pyright]
exclude = [
  "**/sphinxext.py",
  "**/tests/fixtures/anapp.py",
]

[tool.black]
line-length = 80
target-version = ['py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.git
    | \.tox
    | env
    | build
    | dist
  )/
)
'''

[tool.tox]
requires = ["tox>=4"]
env_list = [
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
    "pypy3",
    "coverage",
    "pre-commit",
    "docs",
    "mypy",
    "pyright",
]
skip_missing_interpreters = true

[tool.tox.gh.python]
"3.10" = ["py310", "mypy", "pyright"]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314", "pre-commit", "coverage"]
"pypy-3.11" = ["pypy3"]

[tool.tox.env_run_base]
package = "editable"
extras = ["test"]
commands = [["pytest", "{posargs:dectate}"]]

[tool.tox.env.coverage]
base_python = ["python3"]
extras = ["test", "coverage"]
commands = [
    ["pytest", "--cov", "--cov-fail-under=94", "{posargs:dectate}"],
]

[tool.tox.env.pre-commit]
base_python = ["python3"]
package = "skip"
deps = ["pre-commit"]
commands = [
    ["pre-commit", "run", "--all-files"],
]

[tool.tox.env.docs]
base_python = ["python3"]
extras = ["docs"]
commands = [
    ["sphinx-build", "-b", "doctest", "doc", "{env_tmp_dir}"],
]

[tool.tox.env.mypy]
base_python = ["python3"]
extras = ["mypy"]
commands = [
    ["mypy", "-p", "dectate", "--python-version", "3.10"],
    ["mypy", "-p", "dectate", "--python-version", "3.11"],
    ["mypy", "-p", "dectate", "--python-version", "3.12"],
    ["mypy", "-p", "dectate", "--python-version", "3.13"],
    ["mypy", "-p", "dectate", "--python-version", "3.14"],
]

[tool.tox.env.pyright]
base_python = ["python3"]
extras = ["pyright"]
commands = [
    ["pyright", "dectate", "--pythonversion", "3.10"],
    ["pyright", "dectate", "--pythonversion", "3.11"],
    ["pyright", "dectate", "--pythonversion", "3.12"],
    ["pyright", "dectate", "--pythonversion", "3.13"],
    ["pyright", "dectate", "--pythonversion", "3.14"],
]
