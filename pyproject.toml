[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dectate"
version = "1.0.1.dev0"
dynamic = ["readme"]
description = "A configuration engine for Python frameworks"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{name = "Martijn Faassen", email = "faassen@startifact.com"}]
maintainers = [{name = "Henri Hulski", email = "henri@sancode.it"}]
keywords = ["configuration"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
]
requires-python = ">= 3.11"

[project.urls]
Documentation = "https://dectate.readthedocs.io"
Repository = "https://github.com/morepath/dectate"
Issues = "https://github.com/morepath/dectate/issues"
Changelog = "https://github.com/morepath/dectate/blob/master/CHANGES.txt"

[project.optional-dependencies]
test = ["pytest >= 8", "pytest-env"]
coverage = ["pytest-cov"]
lint = ["ruff"]
docs = ["sphinx < 9.1"]
mypy = ["mypy", "pytest"]
pyright = ["pyright", "pytest"]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
dectate = ["py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.txt"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["dectate"]
addopts = ["-vv"]
env = ["RUN_ENV=test"]

[tool.coverage.run]
omit = ["dectate/tests/*", "dectate/types.py"]
source = ["dectate"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TC", "UP", "RUF"]
ignore = ["E501", "RUF012"]
future-annotations = true

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
known-first-party = ["dectate", "importscan", "reg"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "dectate.tests.fixtures.anapp"
ignore_errors = true

[tool.pyright]
typeCheckingMode = "strict"
exclude = [
  "**/tests/fixtures/anapp.py",
  "__pycache__",
  ".venv",
  "**/.*",
  "**/node_modules",
]
reportPrivateUsage = "none"
reportUnusedClass = "none"
reportUnusedFunction = "none"
reportUntypedFunctionDecorator = "none"

[tool.tox]
requires = ["tox>=4"]
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
    "pypy3",
    "coverage",
    "lint",
    "docs",
    "mypy",
    "pyright",
]
skip_missing_interpreters = true

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314", "coverage", "lint", "mypy", "pyright"]
"3.15" = ["py315"]
"pypy-3.12" = ["pypy3"]

[tool.tox.env_run_base]
package = "editable"
extras = ["test"]
commands = [["pytest", "{posargs:dectate}"]]

[tool.tox.env.coverage]
base_python = ["python3.14"]
extras = ["test", "coverage"]
commands = [
    ["pytest", "--cov", "--cov-fail-under=100", "{posargs:dectate}"],
]

[tool.tox.env.lint]
base_python = ["python3.14"]
extras = ["lint"]
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
]

[tool.tox.env.docs]
base_python = ["python3.14"]
extras = ["docs"]
commands = [
    ["sphinx-build", "-W", "-b", "doctest", "doc", "{env_tmp_dir}"],
    ["sphinx-build", "-W", "-b", "html", "doc", "{env_tmp_dir}"],
]

[tool.tox.env.mypy]
base_python = ["python3.14"]
extras = ["mypy", "docs"]
commands = [
    ["mypy", "--python-version", "3.11"],
    ["mypy", "--python-version", "3.12"],
    ["mypy", "--python-version", "3.13"],
    ["mypy", "--python-version", "3.14"],
    ["mypy", "--python-version", "3.15"],
]

[tool.tox.env.pyright]
base_python = ["python3.14"]
extras = ["pyright", "docs"]
commands = [
    ["pyright", "--pythonversion", "3.11"],
    ["pyright", "--pythonversion", "3.12"],
    ["pyright", "--pythonversion", "3.13"],
    ["pyright", "--pythonversion", "3.14"],
    ["pyright", "--pythonversion", "3.15"],
]

[tool.zest-releaser]
release = false
upload-pypi = false
tag-format = "v{version}"
